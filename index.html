<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entropy — 真随机工具</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%230F1E3C'/><text x='16' y='23' font-size='20' text-anchor='middle' font-family='serif' fill='%2360A5FA'>✦</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=Syne+Mono&family=IBM+Plex+Sans:wght@300;400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #F0F3F8;
  --surface: #FFFFFF;
  --surface2: #EAEef5;
  --surface3: #DDE3EE;
  --line: rgba(15,30,70,0.08);
  --line2: rgba(15,30,70,0.15);
  --text: #0F1E3C;
  --text2: #4A5878;
  --text3: #8E99B5;
  --accent: #1D4ED8;
  --accent-dim: rgba(29,78,216,0.10);
  --accent-dim2: rgba(29,78,216,0.05);
  --accent-bright: #60A5FA;
  --red: #DC2626;
  --red-dim: rgba(220,38,38,0.08);
  --amber: #B45309;
  --amber-dim: rgba(180,83,9,0.08);
  --r: 10px;
  --r-lg: 16px;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  font-family: 'IBM Plex Sans', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
}

/* ── noise overlay ── */
body::before {
  content: '';
  position: fixed; inset: 0;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.025'/%3E%3C/svg%3E");
  pointer-events: none; z-index: 0;
}

.app { max-width: 740px; margin: 0 auto; padding: 48px 20px 100px; position: relative; z-index: 1; }

/* ── header ── */
.masthead { margin-bottom: 44px; }
.wordmark {
  font-family: 'Syne', sans-serif;
  font-size: 13px; font-weight: 700;
  letter-spacing: 0.2em; text-transform: uppercase;
  color: var(--accent);
  margin-bottom: 14px;
}
.masthead h1 {
  font-family: 'Syne', sans-serif;
  font-size: clamp(38px, 7vw, 58px);
  font-weight: 800;
  letter-spacing: -1.5px;
  line-height: 1.0;
  color: var(--text);
}
.masthead h1 span { color: var(--accent); }
.masthead p {
  font-size: 14px; color: var(--text2); margin-top: 10px; line-height: 1.7;
  font-family: 'IBM Plex Sans', sans-serif;
}

/* ── tab nav ── */
.tab-nav {
  display: flex; gap: 0;
  border: 1px solid var(--line2);
  border-radius: var(--r-lg);
  overflow: hidden;
  margin-bottom: 24px;
  background: var(--surface);
}
.tab-btn {
  flex: 1; padding: 14px 8px;
  font-family: 'Syne', sans-serif;
  font-size: 14px; font-weight: 600;
  letter-spacing: 0.03em;
  border: none; background: transparent;
  color: var(--text3); cursor: pointer;
  transition: all 0.2s;
  position: relative;
}
.tab-btn:first-child { border-right: 1px solid var(--line); }
.tab-btn.active {
  background: var(--accent-dim);
  color: var(--accent);
}
.tab-btn .tab-sub {
  display: block; font-family: 'Noto Sans SC', sans-serif;
  font-size: 11px; font-weight: 400; letter-spacing: 0;
  color: var(--text3); margin-top: 2px;
}
.tab-btn.active .tab-sub { color: rgba(29,78,216,0.5); }

/* ── panels ── */
.tab-panel { display: none; animation: fadeUp 0.25s ease; }
.tab-panel.active { display: block; }
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(6px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* ── card ── */
.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  padding: 20px 22px;
  margin-bottom: 12px;
}
.card-label {
  font-family: 'Syne', sans-serif;
  font-size: 10px; font-weight: 700;
  letter-spacing: 0.15em; text-transform: uppercase;
  color: var(--text3); margin-bottom: 14px;
}

/* ─── GROUPS ─── */
.groups-bar {
  display: flex; align-items: center; gap: 8px;
  flex-wrap: wrap; margin-bottom: 16px;
}
.group-chip {
  display: inline-flex; align-items: center; gap: 0;
  border: 1px solid var(--line2);
  border-radius: 20px; overflow: hidden;
  background: var(--surface);
  transition: border-color 0.15s;
}
.group-chip.active { border-color: var(--accent); background: var(--accent-dim); }
.group-chip-name {
  padding: 6px 12px 6px 14px;
  font-family: 'IBM Plex Sans', sans-serif;
  font-size: 13px; font-weight: 500;
  color: var(--text2); cursor: pointer;
  border: none; background: transparent;
  white-space: nowrap; max-width: 120px;
  overflow: hidden; text-overflow: ellipsis;
}
.group-chip.active .group-chip-name { color: var(--accent); }
.group-chip-del {
  padding: 6px 10px 6px 4px;
  font-size: 15px; line-height: 1;
  color: var(--text3); cursor: pointer;
  border: none; background: transparent;
  transition: color 0.1s;
}
.group-chip-del:hover { color: var(--red); }
.group-chip-edit {
  padding: 6px 6px 6px 0;
  font-size: 13px; line-height: 1;
  color: var(--text3); cursor: pointer;
  border: none; background: transparent;
  transition: color 0.1s;
}
.group-chip-edit:hover { color: var(--accent); }
.btn-new-group {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 6px 13px;
  font-family: 'Syne', sans-serif; font-size: 12px; font-weight: 700;
  border: 1px dashed var(--line2);
  border-radius: 20px; background: transparent;
  color: var(--text3); cursor: pointer; transition: all 0.15s;
}
.btn-new-group:hover { border-color: var(--accent); color: var(--accent); }
.group-name-row {
  display: flex; gap: 8px; margin-bottom: 10px;
  align-items: center;
}
.group-title-input {
  font-family: 'IBM Plex Sans', sans-serif;
  font-size: 15px; font-weight: 500;
  padding: 6px 10px;
  border: none; border-bottom: 2px solid var(--accent);
  background: transparent; color: var(--text);
  outline: none; flex: 1; min-width: 0;
}
.group-title-input::placeholder { color: var(--text3); }

/* ─── PICKER PANEL ─── */
.input-row { display: flex; gap: 8px; margin-bottom: 12px; }
.input-row input, input.text-inp {
  font-family: 'IBM Plex Sans', sans-serif;
  font-size: 15px; padding: 11px 14px;
  border: 1px solid var(--line2);
  border-radius: var(--r);
  background: var(--surface2);
  color: var(--text); outline: none;
  transition: border-color 0.15s;
}
.input-row input { flex: 1; }
.input-row input:focus, input.text-inp:focus { border-color: rgba(29,78,216,0.5); }
.input-row input::placeholder { color: var(--text3); }

.btn-primary {
  padding: 10px 18px;
  font-family: 'Syne', sans-serif;
  font-size: 13px; font-weight: 700;
  letter-spacing: 0.05em;
  border: 1px solid var(--accent);
  border-radius: var(--r);
  background: var(--accent);
  color: #FFFFFF; cursor: pointer;
  transition: opacity 0.15s;
  white-space: nowrap;
}
.btn-primary:hover { opacity: 0.85; }
.btn-primary:disabled { opacity: 0.3; cursor: default; }

.btn-ghost {
  padding: 9px 14px;
  font-family: 'Syne', sans-serif;
  font-size: 12px; font-weight: 600;
  border: 1px solid var(--line2);
  border-radius: var(--r);
  background: transparent; color: var(--text2);
  cursor: pointer; transition: all 0.15s;
  white-space: nowrap;
}
.btn-ghost:hover { border-color: var(--line2); background: var(--surface2); color: var(--text); }

/* tags */
#tags-area { display: flex; flex-wrap: wrap; gap: 8px; min-height: 34px; }
.tag {
  display: inline-flex; align-items: center; gap: 6px;
  font-family: 'IBM Plex Sans', sans-serif;
  font-size: 15px; padding: 7px 12px 7px 15px;
  border-radius: 20px;
  border: 1px solid rgba(29,78,216,0.2);
  background: rgba(29,78,216,0.07); color: #1D4ED8;
  transition: all 0.15s;
  cursor: pointer;
  user-select: none;
}
.tag:hover { background: rgba(29,78,216,0.13); border-color: rgba(29,78,216,0.35); }
.tag.elim { opacity: 0.38; text-decoration: line-through; filter: grayscale(1); background: var(--surface2); border-color: var(--line2); color: var(--text3); }
.tag.elim:hover { opacity: 0.6; }
.tag-del {
  background: none; border: none; cursor: pointer;
  color: rgba(29,78,216,0.3); font-size: 17px; line-height: 1;
  padding: 0; display: flex; align-items: center;
  transition: color 0.1s;
}
.tag-del:hover { color: var(--red); }
.empty-tag { font-size: 14px; color: var(--text3); font-style: italic; font-family: 'IBM Plex Sans', sans-serif; }

.counter-row {
  display: flex; justify-content: space-between;
  font-size: 13px; color: var(--text3);
  font-family: 'IBM Plex Sans', sans-serif;
  margin-top: 10px; align-items: center;
}
.counter-row b { color: var(--text2); font-weight: 500; }

.sep { height: 1px; background: var(--line); margin: 14px 0; }

/* bulk */
details summary {
  font-size: 14px; color: var(--text2); cursor: pointer;
  list-style: none; display: flex; align-items: center; gap: 6px;
  user-select: none;
}
details summary::-webkit-details-marker { display: none; }
details summary:hover { color: var(--text); }
.bulk-ta {
  width: 100%; font-family: 'IBM Plex Mono', monospace;
  font-size: 14px; padding: 10px 12px;
  border: 1px solid var(--line2);
  border-radius: var(--r);
  background: var(--surface2); color: var(--text);
  resize: vertical; min-height: 80px; outline: none;
  margin-top: 10px;
}
.bulk-ta:focus { border-color: rgba(29,78,216,0.4); }
.bulk-actions { display: flex; gap: 8px; margin-top: 8px; }

/* config */
.cfg-row {
  display: flex; gap: 12px; flex-wrap: wrap;
  align-items: center; margin-bottom: 14px;
}
.cfg-label { font-size: 14px; color: var(--text2); white-space: nowrap; font-family: 'IBM Plex Sans', sans-serif; }
.num-inp {
  width: 66px; padding: 8px 10px;
  font-family: 'IBM Plex Mono', monospace; font-size: 14px;
  border: 1px solid var(--line2); border-radius: var(--r);
  background: var(--surface2); color: var(--text); outline: none;
}
.num-inp:focus { border-color: rgba(29,78,216,0.4); }

.toggle-group { display: flex; border: 1px solid var(--line2); border-radius: var(--r); overflow: hidden; }
.toggle-btn {
  padding: 8px 14px; font-family: 'Syne', sans-serif;
  font-size: 12px; font-weight: 600;
  border: none; background: transparent;
  color: var(--text3); cursor: pointer; transition: all 0.15s;
}
.toggle-btn.on { background: var(--accent-dim); color: var(--accent); }

.sm-btn {
  padding: 7px 12px; font-size: 12px;
  font-family: 'Syne', sans-serif; font-weight: 600;
  border: 1px solid var(--line);
  border-radius: var(--r);
  background: transparent; color: var(--text3);
  cursor: pointer; transition: all 0.15s;
}
.sm-btn:hover { border-color: var(--line2); color: var(--text2); }
.sm-btn.on { border-color: var(--accent); color: var(--accent); background: var(--accent-dim2); }

/* big pick button */
.btn-pick {
  width: 100%; padding: 18px;
  font-family: 'Syne', sans-serif;
  font-size: 20px; font-weight: 800;
  letter-spacing: 0.08em; text-transform: uppercase;
  border: 1px solid var(--accent);
  border-radius: var(--r-lg);
  background: transparent; color: var(--accent);
  cursor: pointer; transition: all 0.2s;
  position: relative; overflow: hidden;
}
.btn-pick::after {
  content: '';
  position: absolute; inset: 0;
  background: var(--accent);
  transform: translateY(100%);
  transition: transform 0.2s ease;
  z-index: 0;
}
.btn-pick:hover::after { transform: translateY(0); }
.btn-pick:hover { color: #FFFFFF; }
.btn-pick span { position: relative; z-index: 1; }
.btn-pick:disabled { opacity: 0.25; cursor: default; }
.btn-pick:disabled::after { display: none; }

/* result */
.result-big {
  font-family: 'Syne', sans-serif;
  font-size: clamp(22px, 4vw, 32px);
  font-weight: 800;
  letter-spacing: -0.5px;
  color: var(--accent);
  line-height: 1.2;
  margin-bottom: 12px;
  word-break: break-word;
}
.pill {
  display: inline-block;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 11px; padding: 3px 10px;
  border-radius: 20px;
  border: 1px solid var(--line2);
  color: var(--text2); margin: 2px;
}

/* ─── GENERATOR PANEL ─── */
.mode-tabs {
  display: flex; gap: 6px; flex-wrap: wrap;
  margin-bottom: 16px;
}
.mode-tab {
  padding: 7px 14px;
  font-family: 'Syne', sans-serif;
  font-size: 12px; font-weight: 600;
  letter-spacing: 0.04em;
  border: 1px solid var(--line2);
  border-radius: 20px;
  background: transparent; color: var(--text3);
  cursor: pointer; transition: all 0.15s;
}
.mode-tab.on { border-color: var(--accent); color: var(--accent); background: var(--accent-dim2); }

.cfg-block { display: none; }
.cfg-block.show { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 14px; }
.cfg-block label { font-size: 14px; color: var(--text2); font-family: 'IBM Plex Sans', sans-serif; }
.cfg-block input[type=number] {
  width: 72px; padding: 7px 10px;
  font-family: 'IBM Plex Mono', monospace; font-size: 14px;
  border: 1px solid var(--line2); border-radius: var(--r);
  background: var(--surface2); color: var(--text); outline: none;
}
.cfg-block input[type=number]:focus { border-color: rgba(29,78,216,0.4); }
.cfg-block input[type=text] {
  flex: 1; min-width: 200px; padding: 7px 10px;
  font-family: 'IBM Plex Sans', sans-serif; font-size: 14px;
  border: 1px solid var(--line2); border-radius: var(--r);
  background: var(--surface2); color: var(--text); outline: none;
}
.cfg-block input[type=text]:focus { border-color: rgba(29,78,216,0.4); }

.btn-gen {
  width: 100%; padding: 16px;
  font-family: 'Syne', sans-serif;
  font-size: 18px; font-weight: 800;
  letter-spacing: 0.08em; text-transform: uppercase;
  border: 1px solid var(--accent);
  border-radius: var(--r-lg);
  background: var(--accent-dim2); color: var(--accent);
  cursor: pointer; transition: all 0.2s;
  position: relative; overflow: hidden;
}
.btn-gen::after {
  content: '';
  position: absolute; inset: 0;
  background: var(--accent); z-index: 0;
  transform: translateY(100%);
  transition: transform 0.2s ease;
}
.btn-gen:hover::after { transform: translateY(0); }
.btn-gen:hover { color: #FFFFFF; }
.btn-gen span { position: relative; z-index: 1; }

/* number display */
.num-display {
  font-family: 'IBM Plex Mono', monospace;
  font-size: clamp(28px, 6vw, 46px);
  font-weight: 500;
  color: var(--accent);
  letter-spacing: 0.02em;
  line-height: 1.2;
  word-break: break-all;
  margin-bottom: 8px;
}
.num-display.multi { font-size: clamp(18px, 3vw, 24px); }

.entropy-line {
  font-size: 12px; color: var(--text3);
  font-family: 'IBM Plex Mono', monospace;
}
.copy-btn {
  padding: 6px 12px; font-size: 12px;
  font-family: 'Syne', sans-serif; font-weight: 600;
  border: 1px solid var(--line2);
  border-radius: var(--r);
  background: transparent; color: var(--text2);
  cursor: pointer; transition: all 0.15s;
  margin-top: 10px;
}
.copy-btn:hover { border-color: var(--accent); color: var(--accent); }

/* history */
.hist-row {
  display: flex; justify-content: space-between;
  align-items: baseline; padding: 7px 0;
  border-bottom: 1px solid var(--line);
  font-size: 13px;
}
.hist-row:last-child { border-bottom: none; }
.hist-val { font-family: 'IBM Plex Sans', sans-serif; font-size: 14px; color: var(--text2); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding-right: 10px; }
.hist-time { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--text3); white-space: nowrap; }

/* footer */
.footer { margin-top: 32px; font-size: 13px; color: var(--text3); line-height: 1.7; font-family: 'IBM Plex Sans', sans-serif; }
.footer code { font-family: 'IBM Plex Mono', monospace; color: var(--text2); }

/* spin */
@keyframes sp { to { transform: rotate(360deg); } }
.spin { display: inline-block; animation: sp .45s linear infinite; }

/* source badges */
.source-row { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
.src-badge {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 10px; padding: 3px 8px;
  border-radius: 4px;
  background: rgba(29,78,216,0.06);
  border: 1px solid rgba(29,78,216,0.18);
  color: #4A7FE8;
}

/* ── group management ── */
.groups-bar {
  display: flex; gap: 6px; flex-wrap: wrap;
  align-items: center; margin-bottom: 14px;
}
.group-chip {
  display: inline-flex; align-items: center; gap: 0;
  border: 1px solid var(--line2);
  border-radius: 20px; overflow: hidden;
  background: var(--surface2);
  transition: border-color 0.15s;
}
.group-chip.active {
  border-color: var(--accent);
  background: var(--accent-dim2);
}
.group-chip-name {
  font-family: 'IBM Plex Sans', sans-serif;
  font-size: 13px; padding: 6px 12px;
  color: var(--text2); cursor: pointer;
  border: none; background: transparent;
  white-space: nowrap; max-width: 140px;
  overflow: hidden; text-overflow: ellipsis;
}
.group-chip.active .group-chip-name { color: var(--accent); font-weight: 500; }
.group-chip-del {
  background: none; border: none; cursor: pointer;
  color: var(--text3); font-size: 14px;
  padding: 6px 8px 6px 2px; line-height: 1;
  display: flex; align-items: center;
  transition: color 0.1s;
}
.group-chip-del:hover { color: var(--red); }
.group-name-inp {
  font-family: 'IBM Plex Sans', sans-serif;
  font-size: 13px; padding: 6px 10px;
  border: 1px solid var(--line2); border-radius: 20px;
  background: var(--surface2); color: var(--text);
  outline: none; width: 130px;
  transition: border-color 0.15s;
}
.group-name-inp:focus { border-color: rgba(29,78,216,0.5); }
.group-add-btn {
  padding: 6px 12px;
  font-family: 'Syne', sans-serif; font-size: 12px; font-weight: 700;
  border: 1px solid var(--line2); border-radius: 20px;
  background: transparent; color: var(--text2);
  cursor: pointer; white-space: nowrap; transition: all 0.15s;
}
.group-add-btn:hover { border-color: var(--accent); color: var(--accent); }
.btn-new-group {
  padding: 6px 14px;
  font-family: 'Syne', sans-serif; font-size: 12px; font-weight: 700;
  letter-spacing: 0.04em;
  border: 1px dashed var(--line2); border-radius: 20px;
  background: transparent; color: var(--text3);
  cursor: pointer; white-space: nowrap; transition: all 0.15s;
}
.btn-new-group:hover { border-color: var(--accent); color: var(--accent); border-style: solid; }
.group-active-label {
  font-family: 'Syne', sans-serif; font-size: 10px; font-weight: 700;
  letter-spacing: 0.12em; text-transform: uppercase;
  color: var(--text3); margin-bottom: 10px;
  display: flex; align-items: center; justify-content: space-between;
}
.group-rename-inp {
  font-family: 'IBM Plex Sans', sans-serif;
  font-size: 14px; font-weight: 500;
  padding: 3px 8px; border-radius: var(--r);
  border: 1px solid rgba(29,78,216,0.35);
  background: var(--surface2); color: var(--text);
  outline: none; width: 200px;
}

@media (max-width: 480px) {
  .masthead h1 { font-size: 36px; }
  .cfg-row { flex-direction: column; align-items: flex-start; }
}
</style>
</head>
<body>
<div class="app">

  <!-- masthead -->
  <div class="masthead">
    <div class="wordmark">Entropy</div>
    <h1>真<span>随机</span><br>工具箱</h1>
    <p>基于硬件熵源 <code style="font-size:11px;font-family:'IBM Plex Mono',monospace;color:var(--text2);">crypto.getRandomValues()</code>，不是伪随机算法。选项永久存在浏览器里。</p>
  </div>

  <!-- tab nav -->
  <div class="tab-nav">
    <button class="tab-btn active" id="tab-picker" onclick="switchTab('picker')">
      ✦ 随机决策
      <span class="tab-sub">从你的选项里随机选</span>
    </button>
    <button class="tab-btn" id="tab-gen" onclick="switchTab('gen')">
      ◈ 随机数生成
      <span class="tab-sub">整数 · 小数 · 十六进制 · 字节</span>
    </button>
  </div>

  <!-- ══════════ PICKER PANEL ══════════ -->
  <div class="tab-panel active" id="panel-picker">

    <!-- group selector + items -->
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
        <div class="card-label" style="margin:0;">选项组</div>
        <span style="font-size:11px;color:var(--text3);font-family:'IBM Plex Mono',monospace;" id="group-count-hint"></span>
      </div>
      <div class="groups-bar" id="groups-bar"></div>
      <div style="margin:14px 0 12px;">
        <input type="text" id="active-group-title"
          style="font-family:'IBM Plex Sans',sans-serif;font-size:16px;font-weight:500;padding:5px 2px;border:none;border-bottom:2px solid var(--accent);background:transparent;color:var(--text);outline:none;width:100%;max-width:300px;"
          placeholder="清单名称…" maxlength="24"
          oninput="renameGroup(this.value)"
          onkeydown="if(event.key==='Enter')document.getElementById('new-item').focus()">
      </div>
      <div class="input-row">
        <input type="text" id="new-item" placeholder="输入选项，按 Enter 添加" maxlength="80">
        <button class="btn-primary" onclick="addOne()">添加</button>
      </div>
      <div id="tags-area"><span class="empty-tag">还没有选项 — 先添加几个吧</span></div>
      <div style="font-size:11px;color:var(--text3);margin-top:8px;font-family:'IBM Plex Sans',sans-serif;">
        点击选项可划掉 / 恢复 &nbsp;·&nbsp; 点 × 删除
      </div>
      <div class="counter-row">
        <span><b id="p-cnt">0</b> / 100 个 &nbsp;·&nbsp; <b id="p-elim">0</b> 个已划掉</span>
        <button class="btn-ghost" onclick="clearAllItems()" style="padding:5px 10px;font-size:11px;">清空本组</button>
      </div>
      <div class="sep"></div>
      <details>
        <summary>▸ 批量导入（每行一个，或逗号分隔）</summary>
        <textarea class="bulk-ta" id="bulk-ta" placeholder="选项A&#10;选项B&#10;或：A, B, C, D"></textarea>
        <div class="bulk-actions">
          <button class="btn-ghost" onclick="importItems()">导入</button>
          <button class="btn-ghost" onclick="loadPreset()">载入示例（1–20）</button>
        </div>
      </details>
    </div>

    <div class="card">
      <div class="card-label">设置</div>
      <div class="cfg-row">
        <span class="cfg-label">选出几个</span>
        <input type="number" class="num-inp" id="pick-n" value="1" min="1" max="100">
        <span class="cfg-label">模式</span>
        <div class="toggle-group">
          <button class="toggle-btn on" id="t-norepeat" onclick="setRepeat(false)">不重复</button>
          <button class="toggle-btn" id="t-repeat" onclick="setRepeat(true)">可重复</button>
        </div>
      </div>
      <div style="display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;">
        <button class="sm-btn" id="elim-btn" onclick="toggleElim()">划掉模式</button>
        <button class="sm-btn" onclick="resetElim()">恢复所有划掉的</button>
      </div>
      <button class="btn-pick" id="pick-btn" onclick="doPick()" disabled>
        <span>决定吧 —</span>
      </button>
    </div>

    <div class="card" id="pick-result" style="display:none;">
      <div class="card-label">结果</div>
      <div class="result-big" id="pick-display"></div>
      <div id="pick-pills"></div>
    </div>

    <div class="card" id="pick-hist-card" style="display:none;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
        <div class="card-label" style="margin:0;">历史记录</div>
        <button class="sm-btn" onclick="clearPickHist()">清空</button>
      </div>
      <div id="pick-hist"></div>
    </div>

  </div><!-- /panel-picker -->

  <!-- ══════════ GENERATOR PANEL ══════════ -->
  <div class="tab-panel" id="panel-gen">

    <div class="card">
      <div class="card-label">类型</div>
      <div class="mode-tabs">
        <button class="mode-tab on" onclick="setGenMode('int')">整数</button>
        <button class="mode-tab" onclick="setGenMode('float')">小数</button>
        <button class="mode-tab" onclick="setGenMode('hex')">十六进制</button>
        <button class="mode-tab" onclick="setGenMode('bytes')">字节串</button>
        <button class="mode-tab" onclick="setGenMode('choose')">随机选择</button>
      </div>

      <!-- int -->
      <div class="cfg-block show" id="cfg-int">
        <label>范围</label>
        <input type="number" id="g-min" value="1">
        <label>到</label>
        <input type="number" id="g-max" value="100">
        <label>数量</label>
        <input type="number" id="g-int-n" value="1" min="1" max="20">
      </div>
      <!-- float -->
      <div class="cfg-block" id="cfg-float">
        <label>小数位</label>
        <input type="number" id="g-dec" value="6" min="1" max="15">
        <label>数量</label>
        <input type="number" id="g-float-n" value="1" min="1" max="10">
      </div>
      <!-- hex -->
      <div class="cfg-block" id="cfg-hex">
        <label>字节数</label>
        <input type="number" id="g-hex-b" value="16" min="1" max="64">
      </div>
      <!-- bytes -->
      <div class="cfg-block" id="cfg-bytes">
        <label>字节数</label>
        <input type="number" id="g-raw-b" value="8" min="1" max="32">
      </div>
      <!-- choose -->
      <div class="cfg-block" id="cfg-choose">
        <label>选项（逗号分隔）</label>
        <input type="text" id="g-choose-items" value="A, B, C, D, E">
        <label>选几个</label>
        <input type="number" id="g-choose-n" value="1" min="1" max="20">
      </div>

      <button class="btn-gen" onclick="doGen()"><span>生成 —</span></button>
    </div>

    <div class="card" id="gen-result" style="display:none;">
      <div class="card-label">结果</div>
      <div id="gen-display" class="num-display"></div>
      <div class="entropy-line" id="gen-entropy"></div>
      <div class="source-row">
        <span class="src-badge">Web Crypto API</span>
        <span class="src-badge">硬件熵源</span>
        <span class="src-badge" id="gen-time-badge"></span>
      </div>
      <button class="copy-btn" onclick="copyGen()">复制结果</button>
    </div>

    <div class="card" id="gen-hist-card" style="display:none;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
        <div class="card-label" style="margin:0;">历史记录</div>
        <button class="sm-btn" onclick="clearGenHist()">清空</button>
      </div>
      <div id="gen-hist"></div>
    </div>

  </div><!-- /panel-gen -->

  <div class="footer">
    选项数据存储在此浏览器的 localStorage，清除浏览器数据前永久保留。<br>
    随机数来自 OS 硬件熵源（CPU 热噪声、时钟抖动等），非数学算法。
  </div>

</div><!-- /app -->

<script>
/* ── storage keys ── */
const K_GROUPS = 'entropy_groups_v2';
const K_ACTIVE = 'entropy_active_group_v2';
const K_GHIST  = 'entropy_ghist_v1';

/* ── group state ── */
// groups: [ { id, name, items:[], elim:[] } ]
let groups = [];
let activeId = null;
let allowRepeat = false, elimMode = false;
let genHistory = [];
let genMode = 'int';

/* ── helpers ── */
function uid() { const a=new Uint32Array(2); crypto.getRandomValues(a); return a[0].toString(36)+a[1].toString(36); }
function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function activeGroup() { return groups.find(g=>g.id===activeId) || groups[0] || null; }
function getItems() { const g=activeGroup(); return g?g.items:[]; }
function getElim() { const g=activeGroup(); return g?new Set(g.elim):new Set(); }

/* ── persistence ── */
function saveGroups() {
  localStorage.setItem(K_GROUPS, JSON.stringify(groups));
  localStorage.setItem(K_ACTIVE, activeId||'');
  localStorage.setItem(K_GHIST, JSON.stringify(genHistory));
}
function loadAll() {
  try { groups = JSON.parse(localStorage.getItem(K_GROUPS)) || []; } catch { groups = []; }
  try { activeId = localStorage.getItem(K_ACTIVE) || null; } catch { activeId = null; }
  try { genHistory = JSON.parse(localStorage.getItem(K_GHIST)) || []; } catch { genHistory = []; }
  if (!groups.length) {
    groups = [{ id: uid(), name: '默认清单', items: [], elim: [], history: [] }];
  }
  if (!groups.find(g=>g.id===activeId)) activeId = groups[0].id;
}

/* ── true random ── */
function rInt(max) { const a=new Uint32Array(1); crypto.getRandomValues(a); return a[0]%max; }
function rBytes(n) { const a=new Uint8Array(n); crypto.getRandomValues(a); return a; }
function rFloat() {
  const a=new Uint8Array(8); crypto.getRandomValues(a);
  let v=0; for(let i=0;i<8;i++) v=v*256+a[i]; return v/(256**8);
}
function shuffle(arr) {
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){const j=rInt(i+1);[a[i],a[j]]=[a[j],a[i]];}
  return a;
}

/* ── tabs ── */
function switchTab(t) {
  ['picker','gen'].forEach(id=>{
    document.getElementById('tab-'+id).classList.toggle('active',id===t);
    document.getElementById('panel-'+id).classList.toggle('active',id===t);
  });
}

/* ════════ GROUPS ════════ */
function renderGroups() {
  const bar = document.getElementById('groups-bar');
  bar.innerHTML = groups.map(g => {
    const active = g.id === activeId;
    return `<span class="group-chip${active?' active':''}" data-id="${g.id}">
      <button class="group-chip-name" onclick="switchGroup('${g.id}')" title="${esc(g.name)}">${esc(g.name)}</button>
      ${groups.length>1?`<button class="group-chip-del" onclick="deleteGroup('${g.id}')" aria-label="删除组">×</button>`:''}
    </span>`;
  }).join('') +
  `<button class="btn-new-group" onclick="addGroup()">＋ 新建清单</button>`;
  const hint = document.getElementById('group-count-hint');
  if(hint) hint.textContent = groups.length + ' 个清单';
}

function switchGroup(id) {
  activeId = id;
  elimMode = false;
  document.getElementById('elim-btn').classList.remove('on');
  saveGroups(); renderGroups(); renderActiveGroup();
  document.getElementById('pick-result').style.display='none';
  renderPickHist();
}

function addGroup() {
  const g = { id: uid(), name: '新清单', items: [], elim: [], history: [] };
  groups.push(g);
  activeId = g.id;
  saveGroups(); renderGroups(); renderActiveGroup();
  // focus the title input
  const inp = document.getElementById('active-group-title');
  if(inp){ inp.focus(); inp.select(); }
}

function deleteGroup(id) {
  if (groups.length <= 1) { alert('至少保留一个清单'); return; }
  if (!confirm('确定删除这个清单？')) return;
  groups = groups.filter(g=>g.id!==id);
  if (activeId===id) activeId = groups[0].id;
  saveGroups(); renderGroups(); renderActiveGroup();
}

function renameGroup(val) {
  const g = activeGroup(); if(!g) return;
  g.name = val.trim() || '未命名';
  saveGroups(); renderGroups();
}

function renderActiveGroup() {
  const g = activeGroup();
  // update title input
  const titleInp = document.getElementById('active-group-title');
  if(titleInp) titleInp.value = g ? g.name : '';
  renderTags(); updatePickCounts(); renderPickHist();
}

/* ════════ PICKER ════════ */
function renderTags() {
  const a = document.getElementById('tags-area');
  const g = activeGroup();
  const items = g ? g.items : [];
  const elim = g ? new Set(g.elim) : new Set();
  if (!items.length) { a.innerHTML='<span class="empty-tag">还没有选项 — 先添加几个吧</span>'; return; }
  a.innerHTML = items.map((t,i)=>{
    const e = elim.has(i);
    return `<span class="tag${e?' elim':''}" onclick="toggleElimItem(${i})" title="${e?'点击恢复':'点击划掉'}">${esc(t)}<button class="tag-del" onclick="event.stopPropagation();removeItem(${i})" aria-label="删除">×</button></span>`;
  }).join('');
}

function updatePickCounts() {
  const g = activeGroup();
  const items = g?g.items:[];
  const elim = g?new Set(g.elim):new Set();
  document.getElementById('p-cnt').textContent = items.length;
  document.getElementById('p-elim').textContent = elim.size;
  document.getElementById('pick-btn').disabled = items.length === 0;
}

function addOne() {
  const inp = document.getElementById('new-item');
  const v = inp.value.trim();
  if (!v) { inp.value=''; return; }
  const g = activeGroup(); if(!g) return;
  if (g.items.length >= 100) { inp.value=''; return; }
  if (!g.items.includes(v)) { g.items.push(v); saveGroups(); renderTags(); updatePickCounts(); }
  inp.value=''; inp.focus();
}

function removeItem(i) {
  const g = activeGroup(); if(!g) return;
  g.elim = g.elim.filter(e=>e!==i).map(e=>e>i?e-1:e);
  g.items.splice(i,1);
  saveGroups(); renderTags(); updatePickCounts();
}

function clearAllItems() {
  if (!confirm('确定要清空本清单所有选项吗？')) return;
  const g = activeGroup(); if(!g) return;
  g.items=[]; g.elim=[]; g.history=[];
  saveGroups(); renderTags(); updatePickCounts();
  document.getElementById('pick-result').style.display='none';
  document.getElementById('pick-hist-card').style.display='none';
}

function importItems() {
  const raw = document.getElementById('bulk-ta').value;
  const g = activeGroup(); if(!g) return;
  raw.split(/[\n,]/).map(s=>s.trim()).filter(Boolean).forEach(l=>{
    if(g.items.length<100 && !g.items.includes(l)) g.items.push(l);
  });
  document.getElementById('bulk-ta').value='';
  saveGroups(); renderTags(); updatePickCounts();
}

function loadPreset() {
  const g = activeGroup(); if(!g) return;
  g.items=[]; g.elim=[];
  for(let i=1;i<=20;i++) g.items.push('选项 '+i);
  saveGroups(); renderTags(); updatePickCounts();
}

function setRepeat(v) {
  allowRepeat=v;
  document.getElementById('t-repeat').classList.toggle('on',v);
  document.getElementById('t-norepeat').classList.toggle('on',!v);
}
function toggleElim() {
  elimMode=!elimMode;
  document.getElementById('elim-btn').classList.toggle('on',elimMode);
}
function resetElim() {
  const g=activeGroup(); if(!g) return;
  g.elim=[];
  saveGroups(); renderTags(); updatePickCounts();
}
function toggleElimItem(i) {
  const g=activeGroup(); if(!g) return;
  const s=new Set(g.elim);
  if(s.has(i)) s.delete(i); else s.add(i);
  g.elim=[...s];
  saveGroups(); renderTags(); updatePickCounts();
}

function doPick() {
  const btn=document.getElementById('pick-btn');
  btn.innerHTML='<span><span class="spin">◌</span></span>'; btn.disabled=true;
  setTimeout(()=>{
    const g=activeGroup(); if(!g){btn.innerHTML='<span>决定吧 —</span>';btn.disabled=false;return;}
    const elim=new Set(g.elim);
    const pool=allowRepeat
      ? g.items.map((t,i)=>({t,i}))
      : g.items.map((t,i)=>({t,i})).filter(o=>!elim.has(o.i));
    if(!pool.length){
      btn.innerHTML='<span>决定吧 —</span>';btn.disabled=false;
      alert('没有可选项了！请先恢复被划掉的选项。');return;
    }
    const n=Math.min(parseInt(document.getElementById('pick-n').value)||1,pool.length);
    const chosen=allowRepeat
      ?Array.from({length:n},()=>pool[rInt(pool.length)])
      :shuffle(pool).slice(0,n);
    const names=chosen.map(o=>o.t);
    if(elimMode&&!allowRepeat){chosen.forEach(o=>g.elim.push(o.i));renderTags();}
    const rem=allowRepeat?g.items.length:g.items.filter((_,i)=>!new Set(g.elim).has(i)).length;
    document.getElementById('pick-display').textContent=names.join('  /  ');
    document.getElementById('pick-pills').innerHTML=
      `<span class="pill">${n===1?'中选':'选出 '+n+' 个'}</span><span class="pill">剩 ${rem} 个可选</span><span class="pill">${esc(g.name)} · 共 ${g.items.length} 项</span>`;
    document.getElementById('pick-result').style.display='';
    const now=new Date().toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});
    if(!g.history) g.history=[];
    g.history.unshift({time:now,result:names.join(' / '),n});
    if(g.history.length>12) g.history.pop();
    saveGroups(); renderPickHist();
    btn.innerHTML='<span>再决定一次 —</span>';btn.disabled=false;
  },300);
}

function renderPickHist() {
  const card=document.getElementById('pick-hist-card');
  const g=activeGroup();
  const hist=g&&g.history?g.history:[];
  if(!hist.length){card.style.display='none';return;}
  card.style.display='';
  document.getElementById('pick-hist').innerHTML=hist.map(h=>
    `<div class="hist-row"><span class="hist-val">${esc(h.result)}</span><span class="hist-time">${h.n}个 · ${h.time}</span></div>`
  ).join('');
}
function clearPickHist() {
  const g=activeGroup(); if(!g) return;
  g.history=[];
  saveGroups(); renderPickHist();
}

/* ════════ GENERATOR ════════ */
function setGenMode(m) {
  genMode=m;
  ['int','float','hex','bytes','choose'].forEach(k=>{
    document.getElementById('cfg-'+k).classList.toggle('show',k===m);
  });
  document.querySelectorAll('.mode-tab').forEach((b,i)=>{
    b.classList.toggle('on',['int','float','hex','bytes','choose'][i]===m);
  });
}
function doGen() {
  setTimeout(()=>{
    let result='',entropy='';
    if(genMode==='int'){
      const mn=parseInt(document.getElementById('g-min').value),mx=parseInt(document.getElementById('g-max').value);
      const n=Math.min(parseInt(document.getElementById('g-int-n').value)||1,20);
      const nums=Array.from({length:n},()=>rInt(mx-mn+1)+mn);
      result=nums.join(n>1?'  ':'');entropy=`每个 ~${Math.ceil(Math.log2(mx-mn+1))} 位熵 · 用 ${n*4} 字节硬件随机`;
      document.getElementById('gen-display').className='num-display'+(n>3?' multi':'');
    } else if(genMode==='float'){
      const dec=Math.min(parseInt(document.getElementById('g-dec').value)||6,15);
      const n=Math.min(parseInt(document.getElementById('g-float-n').value)||1,10);
      result=Array.from({length:n},()=>rFloat().toFixed(dec)).join(n>1?'\n':'');
      entropy=`精度 ${dec} 位 · 用 ${n*8} 字节硬件随机`;
      document.getElementById('gen-display').className='num-display'+(n>2?' multi':'');
    } else if(genMode==='hex'){
      const nb=Math.min(parseInt(document.getElementById('g-hex-b').value)||16,64);
      result=Array.from(rBytes(nb)).map(b=>b.toString(16).padStart(2,'0')).join('');
      entropy=`${nb} 字节 = ${nb*8} 位熵`;
      document.getElementById('gen-display').className='num-display multi';
    } else if(genMode==='bytes'){
      const nb=Math.min(parseInt(document.getElementById('g-raw-b').value)||8,32);
      result=Array.from(rBytes(nb)).map(b=>b.toString(10).padStart(3,' ')).join(' ');
      entropy=`${nb} 个随机字节，每个 0–255`;
      document.getElementById('gen-display').className='num-display multi';
    } else if(genMode==='choose'){
      const pool=document.getElementById('g-choose-items').value.split(',').map(s=>s.trim()).filter(Boolean);
      const n=Math.min(parseInt(document.getElementById('g-choose-n').value)||1,pool.length||1);
      if(!pool.length){result='请先输入选项';entropy='';}
      else{const chosen=shuffle(pool).slice(0,n);result=chosen.join('\n');entropy=`从 ${pool.length} 个中选 ${n} 个 · ~${Math.ceil(Math.log2(pool.length))} 位熵`;}
      document.getElementById('gen-display').className='num-display'+(n>1?' multi':'');
    }
    document.getElementById('gen-display').textContent=result;
    document.getElementById('gen-entropy').textContent=entropy;
    const now=new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
    document.getElementById('gen-time-badge').textContent=now;
    document.getElementById('gen-result').style.display='';
    genHistory.unshift({time:now,result:result.replace(/\n/g,' / '),mode:genMode});
    if(genHistory.length>10) genHistory.pop();
    saveGroups(); renderGenHist();
  },10);
}
function copyGen() {
  const t=document.getElementById('gen-display').textContent;
  navigator.clipboard.writeText(t).then(()=>{
    const b=document.querySelector('.copy-btn');b.textContent='已复制 ✓';
    setTimeout(()=>{b.textContent='复制结果';},1500);
  });
}
function renderGenHist() {
  const card=document.getElementById('gen-hist-card');
  if(!genHistory.length){card.style.display='none';return;}
  card.style.display='';
  const ml={int:'整数',float:'小数',hex:'十六进制',bytes:'字节',choose:'选择'};
  document.getElementById('gen-hist').innerHTML=genHistory.map(h=>
    `<div class="hist-row"><span class="hist-val">${esc(h.result)}</span><span class="hist-time">${ml[h.mode]||h.mode} · ${h.time}</span></div>`
  ).join('');
}
function clearGenHist(){genHistory=[];saveGroups();renderGenHist();}

/* ── keyboard ── */
document.getElementById('new-item').addEventListener('keydown',e=>{if(e.key==='Enter')addOne();});

/* ── init ── */
loadAll();
renderGroups();
renderActiveGroup();
renderGenHist();
</script>
</body>
</html>
